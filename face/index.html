<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Monk Face</title>
<link rel="icon" href="data:,">
<link rel="stylesheet" href="./demo/tokens.css">
<link rel="stylesheet" href="./demo/demo.css">
</head>
<body>
<canvas id="face" aria-hidden="true"></canvas>

<div class="segmented" id="theme" role="radiogroup" aria-label="Theme">
  <button type="button" role="radio" data-theme="dark" aria-checked="false" aria-label="Dark">
    <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M20 14.5A8 8 0 1 1 9.5 4a6.5 6.5 0 0 0 10.5 10.5z"/></svg>
  </button>
  <button type="button" role="radio" data-theme="light" aria-checked="false" aria-label="Light">
    <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
  </button>
</div>

<div class="panel" id="controls">
  <div class="row" id="states" role="group" aria-label="State"></div>
  <div class="row">
    <button type="button" id="mic">Use mic</button>
    <button type="button" id="tone">Play test tone</button>
    <button type="button" id="recreate">Destroy and recreate</button>
  </div>
  <div class="row">
    <span class="row-label" id="perf-label">Performance</span>
    <div class="segmented" id="perf" role="radiogroup" aria-labelledby="perf-label">
      <button type="button" role="radio" data-mode="auto" aria-checked="true">Auto</button>
      <button type="button" role="radio" data-mode="on" aria-checked="false">On</button>
      <button type="button" role="radio" data-mode="off" aria-checked="false">Off</button>
    </div>
  </div>
</div>
<script type="module" src="./demo/main.ts"></script>
</body>
</html>
